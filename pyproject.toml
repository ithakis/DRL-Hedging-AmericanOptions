[project]
name = "drl-hedging-american-options"
version = "2.0.0"
description = "Deep RL hedging of American options under Heston (PyTorch D4PG-QR revision pipeline)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch>=2.9",
    "numpy>=2.3",
    "scipy>=1.16",
    "pandas>=2.3",
    "numba>=0.63",
    "joblib",
    "tqdm",
    "matplotlib",
    "absl-py",
    "QuantLib>=1.40",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
